# herdr — terminal workspace manager for AI coding agents
# Path (Linux and macOS): ~/.config/herdr/config.toml
# Validate after editing: herdr config check
# Apply to a running server:  herdr server reload-config

onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+a"
goto = "prefix+g"
split_vertical = "prefix+%"
split_horizontal = "prefix+'"

[experimental]
kitty_graphics = true

# vim-herdr-navigation — Ctrl+hjkl moves between Vim splits and herdr panes.
# Plugin: herdr plugin install paulbkim-dev/vim-herdr-navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
