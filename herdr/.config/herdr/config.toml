# herdr — terminal workspace manager for AI coding agents
# Path (Linux and macOS): ~/.config/herdr/config.toml
# Validate after editing: herdr config check
# Apply to a running server:  herdr server reload-config

onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+a"
goto = "prefix+g"
split_vertical = "prefix+%"
split_horizontal = "prefix+'"

[experimental]
kitty_graphics = true
